[package]
name = "luminous"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
  "crates/plugins",
  "crates/image_loader",
  "crates/pipeline",
  "crates/fs_scan",
]
exclude = ["plugins"]

[workspace.dependencies]
bytemuck = "1.25.0"
criterion = { version = "0.8.2", features = ["html_reports"] }
dashmap = "6.1.0"
directories = "6.0.0"
hex = "0.4.3"
log = "0.4.29"
image = { version = "0.25.10", default-features = false }
rayon = "1.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11"
slint = { version = "1.17.0", default-features = false }
tempfile = "3.26.0"
palette = "0.7.6"
pollster = "1.0.1"

[features]
default = ["gif", "jpeg", "png", "tiff", "webp"]
# avif = ["image/avif"]
avif-native = ["image/avif-native", "luminous-fs-scan/avif-native"]
bmp = ["image/bmp", "luminous-fs-scan/bmp"]
dds = ["image/dds", "luminous-fs-scan/dds"]
exr = ["image/exr", "luminous-fs-scan/exr"]
ff = ["image/ff", "luminous-fs-scan/ff"]
gif = ["image/gif", "luminous-fs-scan/gif"]
hdr = ["image/hdr", "luminous-fs-scan/hdr"]
ico = ["image/ico", "luminous-fs-scan/ico"]
jpeg = ["image/jpeg", "luminous-fs-scan/jpeg"]
png = ["image/png", "luminous-fs-scan/png"]
pnm = ["image/pnm", "luminous-fs-scan/pnm"]
qoi = ["image/qoi", "luminous-fs-scan/qoi"]
tga = ["image/tga", "luminous-fs-scan/tga"]
tiff = ["image/tiff", "luminous-fs-scan/tiff"]
webp = ["image/webp", "luminous-fs-scan/webp"]

[dependencies]
luminous-plugins = { path = "crates/plugins" }
luminous-image-loader = { path = "crates/image_loader" }
luminous-pipeline = { path = "crates/pipeline" }
luminous-fs-scan = { path = "crates/fs_scan" }
bytemuck = { workspace = true }
chrono = "0.4.44"
clap = { version = "4.5.57", default-features = false, features = [
  "std",
  "derive",
  "help",
  "usage",
  "error-context",
] }
color-print = "0.3.7"
csscolorparser = "0.8.2"
directories = { workspace = true }
env_logger = "0.11.8"
image = { workspace = true }
kamadak-exif = "0.6.1"
log = { workspace = true }
num_cpus = "1.17.0"
palette = { workspace = true }
pollster = { workspace = true }
rayon = { workspace = true }
rfd = "0.17.2"
serde = { workspace = true }
serde_json = { workspace = true }
toml = "1.1.3"
trash = "5.2.5"
rand = { version = "0.10.2", features = ["thread_rng"] }

[dev-dependencies]
criterion = { workspace = true }

[dependencies.slint]
workspace = true
features = ["std", "compat-1-2", "log", "renderer-skia-opengl"]

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
slint = { version = "1.16.0", default-features = false, features = [
  "backend-winit",
] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
arboard = "3.6.1"
slint = { version = "1.16.0", default-features = false, features = [
  "backend-default",
] }

[build-dependencies]
slint-build = "1.16.0"

[profile.dev]
opt-level = 3
split-debuginfo = "unpacked"
codegen-units = 256

[profile.release]
opt-level = 3
lto = "thin"
strip = true
panic = "abort"
codegen-units = 1

[profile.quick-release]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 256
strip = false

[lib]
doctest = false
